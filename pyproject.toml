[project]
name = "prod-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratik", email = "sharmapratik058@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bm25>=0.3.11",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.14.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.14.0",
]

[project.scripts]
prod-rag = "prod_rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]